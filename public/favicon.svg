<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="akb-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7434E8" />
      <stop offset="100%" stop-color="#9353F3" />
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7434E8" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Card with Gradient & Shadow -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#akb-gradient)" filter="url(#soft-shadow)" />
  
  <!-- Stylized Open Book & Sparkle / 'A' Silhouette -->
  <!-- Left Page -->
  <path d="M128 176 C 176 160, 224 168, 248 192 L 248 352 C 224 332, 176 324, 128 336 Z" fill="#FFFFFF" fill-opacity="0.95" />
  
  <!-- Right Page -->
  <path d="M384 176 C 336 160, 288 168, 264 192 L 264 352 C 288 332, 336 324, 384 336 Z" fill="#FFFFFF" fill-opacity="0.95" />
  
  <!-- Book Spine Center Marker -->
  <path d="M256 186 L 256 356" stroke="#FAF9FE" stroke-width="8" stroke-linecap="round" />

  <!-- Elegant Star / Sparkle Accent above Book -->
  <path d="M 256 120 Q 256 142 272 142 Q 256 142 256 164 Q 256 142 240 142 Q 256 142 256 120 Z" fill="#FDE047" />
</svg>
